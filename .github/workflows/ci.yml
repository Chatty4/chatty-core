name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  ci:
    uses: Chatty4/.github/.github/workflows/python-ci.yml@dev
    with:
      needs-postgres: true
      needs-redis: true
      test-env: |
        SECRET_KEY=ci-not-secret
        CORE_SERVICE_TOKEN=ci-not-secret
        JWT_PRIVATE_KEY_PATH=keys/jwt_private.pem
        JWT_PUBLIC_KEY_PATH=keys/jwt_public.pem
        ALLOWED_HOSTS=127.0.0.1
      pre-test-commands: |
        mkdir -p keys
        python -c "
        from cryptography.hazmat.primitives.asymmetric import rsa
        from cryptography.hazmat.primitives import serialization
        key = rsa.generate_private_key(public_exponent=65537, key_size=2048)
        open('keys/jwt_private.pem', 'wb').write(key.private_bytes(serialization.Encoding.PEM, serialization.PrivateFormat.TraditionalOpenSSL, serialization.NoEncryption()))
        open('keys/jwt_public.pem', 'wb').write(key.public_key().public_bytes(serialization.Encoding.PEM, serialization.PublicFormat.SubjectPublicKeyInfo))
        "
        python manage.py check
        python manage.py makemigrations --check --dry-run